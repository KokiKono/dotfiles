onboarding = false
[ui]
agent_panel_sort = "priority"

show_agent_labels_on_pane_borders = true
[ui.toast]
delivery = "off"

[experimental]
kitty_graphics = true
pane_history = true

# hello-run: prefix(Ctrl+B) → Shift+H で issue ピッカーを popup で開く。
# 自作プラグイン kokikono.hello-run の pane を開くだけ（keys に plugin_pane 型が無いので shell 経由）。
# プラグインの登録は install/macos/herdr.sh が `herdr plugin link` で行う。
[[keys.command]]
key = "prefix+shift+h"
type = "shell"
command = "herdr plugin pane open --plugin kokikono.hello-run --entrypoint pick"
description = "hello-run: issue を選んで作業環境を作る"

# git-diff: prefix(Ctrl+B) → Shift+D で、PR を作る直前の差分を popup で見る。
# 自作プラグイン kokikono.git-diff の pane を開くだけ（hello-run と同じ理由で shell 経由）。
[[keys.command]]
key = "prefix+shift+d"
type = "shell"
command = "herdr plugin pane open --plugin kokikono.git-diff --entrypoint files"
description = "git-diff: 差分を GitHub の Files changed のように見る"

# editor: prefix(Ctrl+B) → Shift+E で、今のペインの cwd を Helix で開く。
# type = "pane" は一時的なズームペインを開き、コマンドが終了したら閉じる。
# 常設の editor ペインにしなかったのは、herdr に「pane を id 指定で focus する」API が
# 無く（pane focus は方向指定のみ）、zoom と focus が別管理だから。ズームしても入力は
# 元のペインに行ってしまう。一時ペインなら閉じ忘れも「見失い」も起きない。
# cwd は main ペインならセッションディレクトリ、repo ペインならその worktree になる。
[[keys.command]]
key = "prefix+shift+e"
type = "pane"
command = "hx ."
description = "editor: このペインの cwd を Helix で開く"

# lazygit: prefix(Ctrl+B) → Shift+G。popup はタブのレイアウトを変えないので、
# ステージとコミットのあいだだけ被せて使う用途に合う（git-diff プラグインと同じ理由）。
[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = "lazygit"
description = "lazygit: ステージ・コミット・ブランチ操作"
width = "90%"
height = "90%"

# reviewr: prefix(Ctrl+B) → Shift+R で、エージェントが書いた差分のレビューペインを開閉する。
# 外部プラグイン persiyanov.reviewr（`herdr plugin install` で導入）が toggle アクションを
# 持つので、自作プラグインと違い shell を介さず plugin_action で直接呼べる。
[[keys.command]]
key = "prefix+shift+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "reviewr: 差分レビューペインを開閉する"
